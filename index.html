    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans JP"', '"Noto Sans Bengali"', '"Noto Sans Devanagari"', 'sans-serif'] },
                    colors: {
                        school: { DEFAULT: '#1a3a6e', light: '#e8eef8' },
                        accent: { DEFAULT: '#c0392b', light: '#fdf0ef' },
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans JP', 'Noto Sans Bengali', 'Noto Sans Devanagari', sans-serif; }
        .lesson-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.10); }
        .lesson-card { transition: transform 0.2s, box-shadow 0.2s; }
        .today-badge { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .timer-digit { font-variant-numeric: tabular-nums; }
        .lang-btn { transition: all 0.15s; }
        .lang-btn.active { background: white; color: #1a3a6e; font-weight: 800; }

<body class="bg-gray-50 min-h-screen">

    <!-- 質問モーダル -->
    <div id="question-modal" class="fixed inset-0 z-50 items-center justify-center bg-black/60 backdrop-blur-sm" style="display:none;">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-full mx-4" style="width:480px">
            <div id="q-form-screen">
                <p data-i18n="q_title" class="text-2xl font-black text-school mb-5"></p>
                <div class="space-y-3">
                    <div>
                        <label data-i18n="q_name" class="block text-xs font-bold text-gray-500 mb-1"></label>
                        <input id="q-name" type="text" data-i18n-ph="q_name_ph" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2 text-sm outline-none focus:border-school">
                    </div>
                    <div>
                        <label data-i18n="q_country" class="block text-xs font-bold text-gray-500 mb-1"></label>
                        <input id="q-country" type="text" data-i18n-ph="q_country_ph" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2 text-sm outline-none focus:border-school">
                    </div>
                    <div>
                        <label data-i18n="q_email" class="block text-xs font-bold text-gray-500 mb-1"></label>
                        <input id="q-email" type="email" data-i18n-ph="q_email_ph" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2 text-sm outline-none focus:border-school">
                    </div>
                    <div>
                        <label data-i18n="q_message" class="block text-xs font-bold text-gray-500 mb-1"></label>
                        <textarea id="q-message" rows="4" data-i18n-ph="q_message_ph" class="w-full border-2 border-gray-200 rounded-xl px-4 py-2 text-sm outline-none focus:border-school resize-none"></textarea>
                    </div>
                </div>
                <p id="q-error" data-i18n="q_error_empty" class="text-xs text-accent mt-2" style="display:none;"></p>
                <div class="flex gap-3 mt-5">
                    <button onclick="sendQuestion()" data-i18n="q_send" class="flex-1 bg-school text-white font-bold py-3 rounded-xl hover:bg-blue-900 transition-colors text-base"></button>
                    <button onclick="closeQuestion()" data-i18n="q_close" class="flex-1 bg-gray-100 text-gray-600 font-bold py-3 rounded-xl hover:bg-gray-200 transition-colors text-base"></button>
                </div>
            </div>
            <div id="q-sending-screen" style="display:none;" class="text-center py-6">
                <p class="text-4xl mb-3">⏳</p>
                <p data-i18n="q_sending" class="text-lg font-bold text-gray-500"></p>
            </div>
            <div id="q-success-screen" style="display:none;" class="text-center py-6">
                <p class="text-5xl mb-3">✅</p>
                <p data-i18n="q_success_title" class="text-xl font-black text-school mb-2"></p>
                <p data-i18n="q_success_sub" class="text-sm text-gray-500 mb-6"></p>
                <button onclick="closeQuestion()" data-i18n="q_close" class="w-full bg-school text-white font-bold py-3 rounded-xl hover:bg-blue-900 transition-colors"></button>
            </div>
            <div id="q-error-screen" style="display:none;" class="text-center py-6">
                <p class="text-5xl mb-3">❌</p>
                <p data-i18n="q_err_title" class="text-xl font-black text-accent mb-2"></p>
                <p data-i18n="q_err_sub" class="text-sm text-gray-500 mb-6"></p>
                <button onclick="showQScreen('form')" data-i18n="q_back" class="w-full bg-school text-white font-bold py-3 rounded-xl hover:bg-blue-900 transition-colors"></button>
            </div>
        </div>
    </div>

    <!-- タイマーモーダル -->
    <div id="timer-modal" class="fixed inset-0 z-50 items-center justify-center bg-black/60 backdrop-blur-sm" style="display:none;">
        <div class="bg-white rounded-2xl shadow-2xl p-12 max-w-full mx-4 text-center" style="width:512px">
            <div id="timer-input-screen">
                <p data-i18n="timer_title" class="text-4xl font-black text-school mb-6"></p>
                <div class="flex items-center justify-center gap-3 mb-6">
                    <input id="timer-minutes-input" type="number" min="1" max="99" value="5"
                        class="text-center font-black border-2 border-school rounded-xl p-2 outline-none" style="width:150px;font-size:3.6rem">
                    <span data-i18n="timer_min" class="text-3xl font-bold text-gray-600"></span>
                </div>
                <div class="flex gap-3">
                    <button onclick="startTimer()" data-i18n="timer_start" class="flex-1 bg-school text-white font-bold py-5 rounded-xl hover:bg-blue-900 transition-colors text-2xl"></button>
                    <button onclick="closeTimer()" data-i18n="timer_close" class="flex-1 bg-gray-100 text-gray-600 font-bold py-5 rounded-xl hover:bg-gray-200 transition-colors text-2xl"></button>
                </div>
            </div>
            <div id="timer-running-screen" style="display:none;">
                <p data-i18n="timer_remaining" class="text-xl font-bold text-gray-400 mb-2"></p>
                <p id="timer-display" class="timer-digit font-black text-school mb-2 tracking-tight" style="font-size:7.2rem">00:00</p>
                <div class="w-full bg-gray-100 rounded-full h-5 mb-6">
                    <div id="timer-progress" class="bg-school h-5 rounded-full transition-all duration-1000" style="width:100%"></div>
                </div>
                <div class="flex gap-3">
                    <button id="timer-pause-btn" onclick="togglePause()" class="flex-1 bg-yellow-400 text-white font-bold py-5 rounded-xl hover:bg-yellow-500 transition-colors text-xl"></button>
                    <button onclick="resetTimer()" data-i18n="timer_reset" class="flex-1 bg-gray-100 text-gray-600 font-bold py-5 rounded-xl hover:bg-gray-200 transition-colors text-xl"></button>
                </div>
            </div>
            <div id="timer-timeup-screen" style="display:none;">
                <p class="text-6xl mb-4">🎉</p>
                <p data-i18n="timer_timeup" class="text-3xl font-black text-accent mb-2"></p>
                <p data-i18n="timer_timeup_sub" class="text-gray-500 mb-6"></p>
                <button onclick="resetTimer()" data-i18n="timer_again" class="w-full bg-school text-white font-bold py-3 rounded-xl hover:bg-blue-900 transition-colors text-lg"></button>
            </div>
        </div>
    </div>

        var currentLang = localStorage.getItem('c4lang') || 'ja';

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('c4lang', lang);
            var d = T[lang];
            // テキスト更新
            document.querySelectorAll('[data-i18n]').forEach(function(el) {
                var key = el.getAttribute('data-i18n');
                if (d[key] !== undefined) el.textContent = d[key];
            });
            // placeholder 更新
            document.querySelectorAll('[data-i18n-ph]').forEach(function(el) {
                var key = el.getAttribute('data-i18n-ph');
                if (d[key] !== undefined) el.placeholder = d[key];
            });
            // 言語ボタンのアクティブ状態
            ['bn','ne','en','ja'].forEach(function(l) {
                var btn = document.getElementById('lang-' + l);
                if (l === lang) { btn.classList.add('active'); }
                else { btn.classList.remove('active'); }
            });
            // html lang 属性
            var langMap = { ja: 'ja', en: 'en', bn: 'bn', ne: 'ne' };
            document.documentElement.lang = langMap[lang] || 'ja';
        }

        // ── タイマー ──────────────────────────────────────
        var timerInterval = null, totalSeconds = 0, remainingSeconds = 0, isPaused = false;

        function openTimer() {
            document.getElementById('timer-modal').style.display = 'flex';
            showScreen('input');
        }
        function closeTimer() {
            clearInterval(timerInterval); timerInterval = null;
            document.getElementById('timer-modal').style.display = 'none';
        }
        function showScreen(name) {
            document.getElementById('timer-input-screen').style.display   = name === 'input'   ? 'block' : 'none';
            document.getElementById('timer-running-screen').style.display = name === 'running' ? 'block' : 'none';
            document.getElementById('timer-timeup-screen').style.display  = name === 'timeup'  ? 'block' : 'none';
        }
        function startTimer() {
            var minutes = parseInt(document.getElementById('timer-minutes-input').value) || 1;
            totalSeconds = minutes * 60; remainingSeconds = totalSeconds; isPaused = false;
            updateDisplay(); updateProgress(); showScreen('running');
            document.getElementById('timer-pause-btn').textContent = T[currentLang].timer_pause;
            clearInterval(timerInterval);
            timerInterval = setInterval(tick, 1000);
        }
        function tick() {
            if (isPaused) return;
            remainingSeconds--; updateDisplay(); updateProgress();
            if (remainingSeconds <= 0) {
                clearInterval(timerInterval); timerInterval = null;
                setTimeout(function() { showScreen('timeup'); }, 200);
            }
        }
        function updateDisplay() {
            var m = Math.floor(remainingSeconds / 60), s = remainingSeconds % 60;
            document.getElementById('timer-display').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        }
        function updateProgress() {
            var pct = totalSeconds > 0 ? (remainingSeconds / totalSeconds) * 100 : 0;
            var bar = document.getElementById('timer-progress');
            bar.style.width = pct + '%';
            if (pct > 50) bar.className = 'bg-school h-5 rounded-full transition-all duration-1000';
            else if (pct > 20) bar.className = 'bg-yellow-400 h-3 rounded-full transition-all duration-1000';
            else bar.className = 'bg-red-500 h-3 rounded-full transition-all duration-1000';
        }
        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('timer-pause-btn').textContent = isPaused ? T[currentLang].timer_resume : T[currentLang].timer_pause;
        }
        function resetTimer() {
            clearInterval(timerInterval); timerInterval = null; showScreen('input');
        }
        document.getElementById('timer-modal').addEventListener('click', function(e) { if (e.target === this) closeTimer(); });

        // ── 質問フォーム ──────────────────────────────────
        function openQuestion() {
            showQScreen('form');
            document.getElementById('q-name').value = '';
            document.getElementById('q-country').value = '';
            document.getElementById('q-email').value = '';
            document.getElementById('q-message').value = '';
            document.getElementById('q-error').style.display = 'none';
            document.getElementById('question-modal').style.display = 'flex';
        }
        function closeQuestion() { document.getElementById('question-modal').style.display = 'none'; }
        function showQScreen(name) {
            document.getElementById('q-form-screen').style.display    = name === 'form'    ? 'block' : 'none';
            document.getElementById('q-sending-screen').style.display = name === 'sending' ? 'block' : 'none';
            document.getElementById('q-success-screen').style.display = name === 'success' ? 'block' : 'none';
            document.getElementById('q-error-screen').style.display   = name === 'error'   ? 'block' : 'none';
        }
        async function sendQuestion() {
            var name    = document.getElementById('q-name').value.trim();
            var country = document.getElementById('q-country').value.trim();
            var email   = document.getElementById('q-email').value.trim();
            var message = document.getElementById('q-message').value.trim();
            if (!name || !country || !email || !message) {
                document.getElementById('q-error').style.display = 'block'; return;
            }
            showQScreen('sending');
            try {
                var res = await fetch('https://formspree.io/f/mbdvyvzl', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ name: name, country: country, email: email, message: message })
                });
                showQScreen(res.ok ? 'success' : 'error');
            } catch(e) { showQScreen('error'); }
        }
        document.getElementById('question-modal').addEventListener('click', function(e) { if (e.target === this) closeQuestion(); });

        // 初期化
        setLang(currentLang);
    </script>
